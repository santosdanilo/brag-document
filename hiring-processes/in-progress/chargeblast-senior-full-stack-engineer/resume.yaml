title: Senior Full Stack Engineer | TypeScript, Angular & Node.js

introduction: |
  Full Stack Engineer with 7+ years building web applications, with recent end-to-end work across TypeScript, React, Node.js, Deno, PostgreSQL, and Angular.
  Modernized a business-critical payment system from AngularJS and CoffeeScript to Angular and TypeScript without interrupting operations, and delivered a real-time trading prototype in under three weeks.
  Reduced warm API latency by 95.7%, enabled atomic multi-step operations, and built data-rich interfaces that remain responsive across large datasets.

