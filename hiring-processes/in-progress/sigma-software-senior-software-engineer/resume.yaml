  Established layered backend architecture with transaction support, reduced API latency by 95.7%, and delivered a real-time trading platform prototype in under three weeks.
  Experience includes complex business workflows, financial-adjacent systems, automated testing, AWS Lambda, CI/CD, monorepos, and end-to-end technical ownership.

